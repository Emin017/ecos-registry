name: Registry validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Ruff lint
        run: uv run --locked ruff check

      - name: ty type check
        run: uv run --locked ty check

      - name: pyright type check
        run: uv run --locked pyright

      - name: Test validator
        run: uv run --locked python -m unittest discover -s tests

      - name: Validate live registry
        run: >-
          uv run --locked python .github/scripts/validate_registry.py
          tool-registry.json --check-urls

      - name: Validate example registry
        run: >-
          uv run --locked python .github/scripts/validate_registry.py
          examples/tool-registry.example.json
